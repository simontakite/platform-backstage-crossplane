name: Build and Push Backstage Docker Image

on:
  push:
    branches: ["main"]
    paths:
      - "backstage/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: absolootly/backstage

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node (Backstage requires modern Node)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: backstage/yarn.lock

      # 3. Install dependencies (ROOT of Backstage)
      - name: Install dependencies
        working-directory: backstage
        run: yarn install --immutable

      # 4. Compile TypeScript (REQUIRED for skeleton)
      - name: Compile TypeScript
        working-directory: backstage
        run: yarn tsc

      # 5. Build backend bundle + skeleton
      - name: Build backend bundle
        working-directory: backstage
        run: yarn build:backend

      # 6. Verify build artifacts (debug safety)
      - name: Verify build artifacts
        run: |
          ls -lah backstage/packages/backend/dist

      # 7. Setup Docker Buildx (REQUIRED for mount cache in Dockerfile)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 9. Extract commit SHA
      - name: Extract commit ID
        id: vars
        run: echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 10. Build and push image (IMPORTANT: root context!)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backstage
          file: backstage/packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.COMMIT_ID }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max