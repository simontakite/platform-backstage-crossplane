apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: crossplane-system
spec:
  interval: 5m

  chart:
    spec:
      chart: crossplane
      version: "v2.2.0" # Latest stable as of 2024-06
      sourceRef:
        kind: HelmRepository
        name: crossplane-stable
        namespace: flux-system

  install:
    createNamespace: true

  upgrade:
    remediation:
      retries: 3